<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1525"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="favNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="favGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="#040711"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="url(#favNeon)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Shield Shape -->
  <polygon points="64,16 108,32 108,76 64,116 20,76 20,32" 
           fill="url(#favShieldGrad)" 
           stroke="url(#favNeon)" 
           stroke-width="3.5" 
           filter="url(#favGlow)"/>

  <!-- Inner Cyber Nodes -->
  <polygon points="64,26 98,39 98,72 64,104 30,72 30,39" 
           fill="none" 
           stroke="#00ff9d" 
           stroke-width="1.5" 
           stroke-dasharray="5, 3" 
           opacity="0.6"/>

  <!-- Cyber Lock Icon -->
  <g transform="translate(64, 68)">
    <path d="M -12,-9 A 12,12 0 0,1 12,-9 L 12,0 L -12,0 Z" 
          fill="none" 
          stroke="#00ff9d" 
          stroke-width="3" 
          stroke-linecap="round"/>
    <rect x="-16" y="0" width="32" height="24" rx="4" 
          fill="#0c182b" 
          stroke="#00d2ff" 
          stroke-width="2.5"/>
    <circle cx="0" cy="10" r="3.5" fill="#00ff9d"/>
    <path d="M -2,10 L 2,10 L 3,18 L -3,18 Z" fill="#00ff9d"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2338"/>
      <stop offset="70%" stop-color="#050a14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#090e17"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0ac69"/>
      <stop offset="100%" stop-color="#b88349"/>
    </linearGradient>
    <filter id="avGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Frame with Cyber Tick Marks -->
  <circle cx="150" cy="150" r="140" fill="url(#cyberBg)" stroke="url(#avatarGlow)" stroke-width="3"/>
  <circle cx="150" cy="150" r="146" fill="none" stroke="#00ff9d" stroke-width="1" stroke-dasharray="8 6" opacity="0.4"/>
  
  <!-- Cyber HUD Tech Rings -->
  <path d="M 40,150 A 110,110 0 0,1 150,40" fill="none" stroke="#00d2ff" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.6"/>
  <path d="M 260,150 A 110,110 0 0,1 150,260" fill="none" stroke="#00ff9d" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.6"/>

  <!-- Developer Silhouette with Hoodie & Headset -->
  <g id="developer">
    <!-- Shoulders & Torso (Cyber Hoodie) -->
    <path d="M 60,285 C 60,230 95,205 130,200 L 150,220 L 170,200 C 205,205 240,230 240,285 Z" 
          fill="url(#hoodieGrad)" 
          stroke="url(#avatarGlow)" 
          stroke-width="1.8"/>

    <!-- Inner Collar Neon Trim -->
    <path d="M 120,202 L 150,235 L 180,202" fill="none" stroke="#00ff9d" stroke-width="2.5" filter="url(#avGlow)"/>

    <!-- Neck -->
    <rect x="135" y="165" width="30" height="30" rx="4" fill="#c28c52"/>

    <!-- Head / Face -->
    <ellipse cx="150" cy="142" rx="38" ry="46" fill="url(#skinGrad)"/>

    <!-- Hair / Sleek Tech Style -->
    <path d="M 112,130 C 112,95 130,80 150,80 C 170,80 188,95 188,130 C 182,108 170,95 150,95 C 130,95 118,108 112,130 Z" fill="#1b2333"/>

    <!-- Cyber HUD Smart Visor / Glasses -->
    <rect x="116" y="128" width="68" height="20" rx="5" 
          fill="#051524" 
          stroke="url(#avatarGlow)" 
          stroke-width="2" 
          filter="url(#avGlow)"/>
    <!-- Visor Reflection Data Scanline -->
    <line x1="120" y1="138" x2="180" y2="138" stroke="#00ff9d" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="176" cy="138" r="2.5" fill="#00d2ff"/>

    <!-- Beard / Groomed Stubble -->
    <path d="M 126,155 C 132,178 168,178 174,155 C 170,185 130,185 126,155 Z" fill="#242b38" opacity="0.8"/>

    <!-- Smile / Friendly Expression -->
    <path d="M 141,164 Q 150,170 159,164" fill="none" stroke="#242b38" stroke-width="2" stroke-linecap="round"/>

    <!-- Pro Cyber Headset -->
    <path d="M 110,135 A 44,44 0 0,1 190,135" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <!-- Ear cups -->
    <rect x="106" y="124" width="8" height="26" rx="4" fill="#00d2ff" filter="url(#avGlow)"/>
    <rect x="186" y="124" width="8" height="26" rx="4" fill="#00ff9d" filter="url(#avGlow)"/>
    <!-- Mic boom -->
    <path d="M 110,144 Q 118,170 135,166" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="137" cy="166" r="3" fill="#00ff9d"/>
  </g>

  <!-- Floating Binary/Code Bits -->
  <text x="50" y="90" font-family="monospace" font-size="10" fill="#00ff9d" opacity="0.6">01001</text>
  <text x="220" y="100" font-family="monospace" font-size="10" fill="#00d2ff" opacity="0.6">&lt;dev/&gt;</text>
  <text x="55" y="210" font-family="monospace" font-size="10" fill="#00d2ff" opacity="0.5">SEC::OK</text>
  <text x="215" y="215" font-family="monospace" font-size="10" fill="#00ff9d" opacity="0.5">256-BIT</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Neon Gradients -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- SHIELD EMBLEM -->
  <g transform="translate(10, 10)">
    <!-- Shield Outer Glow & Outline -->
    <polygon points="50,4 88,18 88,58 50,96 12,58 12,18" 
             fill="url(#shieldGrad)" 
             stroke="url(#neonGlow)" 
             stroke-width="2.5" 
             filter="url(#glowFilter)"/>

    <!-- Inner Shield Border -->
    <polygon points="50,12 80,24 80,54 50,86 20,54 20,24" 
             fill="none" 
             stroke="#00ff9d" 
             stroke-width="1.2" 
             stroke-opacity="0.5" 
             stroke-dasharray="4, 3"/>

    <!-- Circuit Lines Inside Shield -->
    <path d="M 30,34 L 42,34 L 46,44 L 54,44 L 58,34 L 70,34" 
          fill="none" 
          stroke="#00d2ff" 
          stroke-width="1.5" 
          stroke-linecap="round"/>
    
    <circle cx="30" cy="34" r="2.5" fill="#00ff9d"/>
    <circle cx="70" cy="34" r="2.5" fill="#00d2ff"/>

    <!-- Central Cyber Keyhole / Lock Core -->
    <g transform="translate(50, 56)">
      <!-- Lock Shackle -->
      <path d="M -9,-6 A 9,9 0 0,1 9,-6 L 9,0 L -9,0 Z" 
            fill="none" 
            stroke="#00ff9d" 
            stroke-width="2.2" 
            stroke-linecap="round"/>
      <!-- Lock Body -->
      <rect x="-13" y="0" width="26" height="20" rx="3" 
            fill="#0b1726" 
            stroke="#00d2ff" 
            stroke-width="1.8"/>
      <!-- Glowing Keyhole -->
      <circle cx="0" cy="8" r="3" fill="#00ff9d" filter="url(#glowFilter)"/>
      <path d="M -1.5,8 L 1.5,8 L 2.5,15 L -2.5,15 Z" fill="#00ff9d"/>
    </g>

    <!-- Radar Pulse Wave Accent -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="#00d2ff" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="8, 6"/>
  </g>

  <!-- TYPOGRAPHY -->
  <!-- "MR.SALL" -->
  <text x="125" y="62" 
        font-family="'Orbitron', 'Rajdhani', 'Segoe UI', -apple-system, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#ffffff">
    MR<tspan fill="#00ff9d">.</tspan><tspan fill="url(#cyberGreen)">SALL</tspan>
  </text>

  <!-- Subtitle: "CYBERSECURITY ACADEMY" -->
  <text x="128" y="88" 
        font-family="'Rajdhani', 'Orbitron', 'Segoe UI', -apple-system, sans-serif" 
        font-size="13.5" 
        font-weight="700" 
        letter-spacing="5.5" 
        fill="#00d2ff" 
        opacity="0.95">
    CYBERSECURITY ACADEMY
  </text>

  <!-- Decorative Cyber Terminal Prompt line -->
  <line x1="128" y1="98" x2="390" y2="98" stroke="url(#cyberGreen)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="395" cy="98" r="2" fill="#00ff9d"/>
  <circle cx="403" cy="98" r="1.5" fill="#00d2ff" opacity="0.7"/>
</svg>

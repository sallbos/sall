<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#091222"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="ogNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#00ff9d" stroke-width="0.5" opacity="0.12">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Big Shield Logo Graphic on Right -->
  <g transform="translate(780, 160) scale(3.5)">
    <polygon points="50,4 88,18 88,58 50,96 12,58 12,18" fill="#0d1b2a" stroke="url(#ogNeon)" stroke-width="2.5"/>
    <polygon points="50,12 80,24 80,54 50,86 20,54 20,24" fill="none" stroke="#00ff9d" stroke-width="1.2" opacity="0.6"/>
    <path d="M 30,34 L 42,34 L 46,44 L 54,44 L 58,34 L 70,34" fill="none" stroke="#00d2ff" stroke-width="1.5"/>
    <g transform="translate(50, 56)">
      <path d="M -9,-6 A 9,9 0 0,1 9,-6 L 9,0 L -9,0 Z" fill="none" stroke="#00ff9d" stroke-width="2.2"/>
      <rect x="-13" y="0" width="26" height="20" rx="3" fill="#0b1726" stroke="#00d2ff" stroke-width="1.8"/>
      <circle cx="0" cy="8" r="3" fill="#00ff9d"/>
    </g>
  </g>

  <!-- Title & Branding on Left -->
  <text x="100" y="210" font-family="sans-serif" font-size="28" font-weight="700" fill="#00ff9d" letter-spacing="6">CYBERSECURITY ACADEMY</text>
  <text x="100" y="300" font-family="sans-serif" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="2">MR.SALL</text>
  <text x="100" y="380" font-family="sans-serif" font-size="36" font-weight="600" fill="#00d2ff">Learn. Protect. Innovate.</text>
  <text x="100" y="450" font-family="sans-serif" font-size="24" fill="#94a3b8">أكاديمية تعليم الأمن السيبراني والاختراق الأخلاقي</text>

  <!-- Founder Tag -->
  <rect x="100" y="500" width="480" height="50" rx="25" fill="#0f1f33" stroke="url(#ogNeon)" stroke-width="1.5"/>
  <text x="130" y="533" font-family="sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">Founder: صالح عبد القيوم بالشيخ</text>
</svg>
